{% extends 'base.html' %}

{% block title %}Login - Jalaram Electric{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm p-4">
            <h3 class="fw-bold text-center mb-3"><i class="bi bi-box-arrow-in-right text-warning"></i> Sign In</h3>
            <p class="text-muted text-center small mb-4">Access your Jalaram Electric shopping and orders</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 py-2 fw-bold mt-2">Login</button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <small class="text-muted">Don't have an account? <a href="{% url 'register' %}" class="fw-bold text-dark">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
